name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.platform }}
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    env:
      TIGIRL_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Test script cleanup, installer resilience and failure propagation
        shell: pwsh
        run: |
          foreach ($script in @('packaging/setup/deploy.ps1','packaging/install.ps1','packaging/initialize.ps1','packaging/data.ps1','packaging/retirement.ps1')) {
            $tokens=$null; $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors)
            if ($errors) { throw (($errors | ForEach-Object { "${script}: $_" }) -join "`n") }
          }
          python tests/test_candidate_ui_presentation_cleanup.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_candidate_placement_cleanup.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -Werror tests/test_sentence_review_cleanup.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/setup_resilience_policy_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:TIGIRL_PLATFORM -eq 'x64') {
            & ./tests/setup_machine_recovery_test.ps1
            & ./tests/setup_locked_cleanup_test.ps1
            & ./tests/setup_transaction_test.ps1
            & ./tests/setup_repair_adoption_test.ps1
            & ./tests/package_data_test.ps1
            & ./tests/setup_data_baseline_test.ps1
            & ./tests/setup_retirement_test.ps1
            & ./tests/setup_package_paths_test.ps1
          }
      - name: Compile installer and test runtime generations (no installation)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 'Tigirl-Inno-6.7.3'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash $setup).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno download hash mismatch' }
          $p = Start-Process $setup -ArgumentList @('/PORTABLE=1','/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS','/SP-',('/DIR="'+$tools+'"')) -Wait -PassThru
          if ($p.ExitCode) { throw 'Portable compiler extraction failed' }
          & ./tests/setup_compiler_smoke_test.ps1 -Compiler (Join-Path $tools 'ISCC.exe')
      - name: Compile DLL, loader probe and all production tools (no model)
        shell: pwsh
        run: ./build_native.ps1 -Platform $env:TIGIRL_PLATFORM -PlatformToolset v145
      - name: Import bundled schemas and verify real lookup data (no model)
        shell: pwsh
        run: |
          python tests/bundled_schemas_test.py --platform $env:TIGIRL_PLATFORM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run core and candidate layout/presentation regressions with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC environment unavailable' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          $arch = if ($env:TIGIRL_PLATFORM -eq 'Win32') { 'x86' } else { 'x64' }
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=$arch -host_arch=x64"
          python tests/test_learning_maintenance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/sentence_learning_test.py --cxx cl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/run_core_tests.py --cxx cl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/sentence_review_test.py --cxx cl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$vs\MSBuild\Current\Bin\MSBuild.exe" tests/SentenceWorkerProbe.vcxproj /nr:false /p:Configuration=Release "/p:Platform=$env:TIGIRL_PLATFORM" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./build/tests/$env:TIGIRL_PLATFORM/sentence_worker_probe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/candidate_ui_layout_test.py --negative-control
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/candidate_ui_presentation_test.py --negative-control
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/candidate_orientation_test.py --cxx cl --ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/candidate_host_dpi_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: TSF edit-session candidate layout regression (no registration or model)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (!$vs) { throw 'MSBuild unavailable' }
          & "$vs\MSBuild\Current\Bin\MSBuild.exe" tests/CandidateLayoutHost.vcxproj /nr:false /p:Configuration=Release "/p:Platform=$env:TIGIRL_PLATFORM" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/candidate_layout_test.py --platform $env:TIGIRL_PLATFORM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  portable:
    name: Linux ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python tests/test_candidate_ui_presentation_cleanup.py -v
      - run: python tests/test_candidate_placement_cleanup.py -v
      - run: python -Werror tests/test_sentence_review_cleanup.py -v
      - run: python tests/setup_resilience_policy_test.py
      - run: python tests/bundled_schemas_test.py --verify-only
      - run: python tests/run_core_tests.py --cxx clang++ --sanitize
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - run: python tests/candidate_orientation_test.py --cxx clang++ --sanitize
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - run: python tests/test_learning_maintenance.py
      - run: python tests/sentence_learning_test.py --cxx clang++ --sanitize
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Review regressions including mapped model, history and journal
        run: python tests/sentence_review_test.py --cxx clang++ --sanitize
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Functional fault injection
        run: python tests/sentence_review_negative.py --cxx g++
      - name: Independent pre-review source comparison
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/tigirl-pre-review"
          mkdir -p "$baseline"
          git archive 4f88a4eeffd07fa0cf26e5e26d04d2b760ab6c5b | tar -x -C "$baseline"
          python tests/compare_sentence_revisions.py --baseline "$baseline" --report sentence-equivalence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sentence-review-equivalence
          path: sentence-equivalence*
          retention-days: 7
          if-no-files-found: warn
