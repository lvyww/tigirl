name: Apply review hardening patch

on:
  push:
    branches: [fix/review-hardening-20260917]
    paths:
      - review_hardening.patch
      - .github/workflows/apply-review-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/review-hardening-20260917
          fetch-depth: 0
      - name: Apply patch and self-remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check review_hardening.patch
          git apply review_hardening.patch
          python tests/review_hardening_policy_test.py
          git rm review_hardening.patch .github/workflows/apply-review-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden refresh, sentence resources and TSF registration'
          git push origin HEAD:fix/review-hardening-20260917
