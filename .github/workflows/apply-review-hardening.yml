name: Apply review hardening patch

on:
  push:
    branches: [fix/review-hardening-20260917]
    paths:
      - apply_review_hardening.py
      - apply_review_hardening.trigger
      - .github/workflows/apply-review-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/review-hardening-20260917
          fetch-depth: 0
      - name: Apply transform and stage source-only commit
        shell: bash
        run: |
          set -euo pipefail
          python apply_review_hardening.py
          # GITHUB_TOKEN cannot update existing workflow files. Keep the normal
          # CI workflow unchanged in this bot commit; run the policy from the
          # already-invoked core runner instead.
          git checkout -- .github/workflows/build-and-test.yml
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/run_core_tests.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import os\n', 'import os\nimport sys\n', 1)
          marker='def main() -> None:\n    parser = argparse.ArgumentParser(description=__doc__)\n'
          replacement="def main() -> None:\n    subprocess.run([sys.executable, str(ROOT / 'tests/review_hardening_policy_test.py')], check=True)\n    parser = argparse.ArgumentParser(description=__doc__)\n"
          if marker not in s:
              raise SystemExit('run_core_tests main marker not found')
          p.write_text(s.replace(marker,replacement,1),encoding='utf-8')
          PY
          python tests/review_hardening_policy_test.py
          git rm review_hardening.patch apply_review_hardening.py apply_review_hardening.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden refresh, sentence resources and TSF registration'
          git push origin HEAD:fix/review-hardening-20260917
